pipeline:
  name: Demo
  identifier: Demo
  projectIdentifier: qajt
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: itcheck
        repoName: Demo
        build: <+input>
  stages:
    - stage:
        name: CI
        identifier: CI
        description: Gradle (Kotlin) tests with Harness TI + coverage (hcli htx, Java agent)
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Gradle test with TI
                  identifier: gradle_test_ti
                  spec:
                    shell: Bash
                    envVariables:
                      TI_V2: "1"
                      TI_COVERAGE_ENABLED: "1"
                      HARNESS_AGENT_CONFIG: "@@logLevel: 4@@logConsole: true"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "build/test-results/test/*.xml"
                    command: |-
                      set -eu
                      # hcli expects HARNESS_TI_SERVICE_TOKEN base64-encoded; CI may inject a raw JWT
                      if [ -n "${HARNESS_TI_SERVICE_TOKEN:-}" ] && ! printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 -d >/dev/null 2>&1; then
                        export HARNESS_TI_SERVICE_TOKEN=$(printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 | tr -d '\n')
                      fi
                      chmod +x gradlew

                      # hcli downloads the Java agent and exports JAVA_TOOL_OPTIONS (picked up by the Gradle test worker).
                      hcli htx \
                        --language kotlin \
                        --setup-agents \
                        --stdout \
                        --report-paths='build/test-results/test/*.xml' \
                        -- ./gradlew --no-daemon test
              - step:
                  type: Run
                  name: Upload coverage
                  identifier: upload_coverage
                  spec:
                    shell: Bash
                    command: |-
                      set -eu
                      # hcli expects HARNESS_TI_SERVICE_TOKEN base64-encoded; CI may inject a raw JWT
                      if [ -n "${HARNESS_TI_SERVICE_TOKEN:-}" ] && ! printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 -d >/dev/null 2>&1; then
                        export HARNESS_TI_SERVICE_TOKEN=$(printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 | tr -d '\n')
                      fi
                      # No re-run: use the JaCoCo report the selective TI run above already generated
                      # (`test` is finalizedBy jacocoTestReport). Regenerate from existing exec data only.
                      R=build/reports/jacoco/test/jacocoTestReport.xml
                      [ -f "$R" ] || ./gradlew --no-daemon jacocoTestReport -x test

                      # diagnostics: overall LINE counter (missed/covered)
                      grep -o '<counter type="LINE"[^>]*/>' "$R" | tail -1 || true
                      ls -la build/jacoco/ || true

                      hcli cov upload --file "$R"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
