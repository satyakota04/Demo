pipeline:
  name: Demo
  identifier: Demo
  projectIdentifier: qajt
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: itcheck
        repoName: Demo
        build: <+input>
  stages:
    - stage:
        name: CI
        identifier: CI
        description: Gradle (Kotlin) tests with Harness TI + coverage (hcli htx, Java agent)
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Gradle test with TI
                  identifier: gradle_test_ti
                  spec:
                    shell: Bash
                    envVariables:
                      TI_V2: "1"
                      TI_COVERAGE_ENABLED: "1"
                      HARNESS_AGENT_CONFIG: "@@logLevel: 4@@logConsole: true"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "build/test-results/test/*.xml"
                    command: |-
                      set -eu
                      # hcli expects HARNESS_TI_SERVICE_TOKEN base64-encoded; CI may inject a raw JWT
                      if [ -n "${HARNESS_TI_SERVICE_TOKEN:-}" ] && ! printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 -d >/dev/null 2>&1; then
                        export HARNESS_TI_SERVICE_TOKEN=$(printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 | tr -d '\n')
                      fi
                      chmod +x gradlew

                      # hcli downloads the Java agent and exports JAVA_TOOL_OPTIONS (picked up by the Gradle test worker).
                      hcli htx \
                        --language kotlin \
                        --setup-agents \
                        --stdout \
                        --report-paths='build/test-results/test/*.xml' \
                        -- ./gradlew --no-daemon test
              - step:
                  type: Run
                  name: Upload coverage
                  identifier: upload_coverage
                  spec:
                    shell: Bash
                    command: |-
                      set -eu
                      # hcli expects HARNESS_TI_SERVICE_TOKEN base64-encoded; CI may inject a raw JWT
                      if [ -n "${HARNESS_TI_SERVICE_TOKEN:-}" ] && ! printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 -d >/dev/null 2>&1; then
                        export HARNESS_TI_SERVICE_TOKEN=$(printf '%s' "$HARNESS_TI_SERVICE_TOKEN" | base64 | tr -d '\n')
                      fi
                      # No re-run: upload the per-test coverage the TI agent wrote during the (selective) run above.
                      files=$(find "$HOME/.hcli/ti-agents" -name '*_tiRunner.json' 2>/dev/null || true)
                      if [ -z "$files" ]; then
                        echo "No *_tiRunner.json coverage produced; coverage-related files:"
                        find "$HOME/.hcli/ti-agents" -ipath '*coverage*' 2>/dev/null | head -50
                        exit 1
                      fi
                      echo "$files"
                      args=()
                      for f in $files; do args+=(--file "$f"); done
                      hcli cov upload "${args[@]}"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
